
name: smoke-test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: CGV 일산점 API 테스트
        shell: bash
        run: |
          python - <<'PY'
          import json
          import urllib.request
          import urllib.error

          url = (
              "https://cgv.co.kr/api/v1/booking/"
              "searchMovScnInfo?"
              "coCd=A420&siteNo=0054"
              "&scnYmd=20261018"
              "&rtctlScopCd=08"
          )

          headers = {
              "User-Agent": "Mozilla/5.0",
              "Accept": "application/json",
          }

          request = urllib.request.Request(
              url, headers=headers
          )

          try:
              with urllib.request.urlopen(
                  request, timeout=15
              ) as response:
                  status = response.status
                  body = response.read()
                  content_type = response.headers.get(
                      "Content-Type", ""
                  )

              print("HTTP 상태:", status)
              print("Content-Type:", content_type)
              print("응답 크기:", len(body), "bytes")

              data = json.loads(body)
              print("JSON 파싱: 성공")

              if isinstance(data, dict):
                  print("최상위 키:", list(data.keys()))
                  print("statusCode:", data.get("statusCode"))
                  print("statusMessage:", data.get("statusMessage"))

              if status == 200:
                  print("CGV API 요청 성공!")
              else:
                  raise SystemExit(1)

          except urllib.error.HTTPError as e:
              print("HTTP 오류:", e.code)
              raise SystemExit(1)

          except Exception as e:
              print("테스트 실패:", type(e).__name__)
              print(str(e))
              raise SystemExit(1)
          PY
